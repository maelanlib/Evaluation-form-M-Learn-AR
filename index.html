<div id="surveyPopup">
  
  <div id="surveyLoading">
    <div class="loading-icon">💜</div>
    <div class="loading-title">กำลังเตรียมแบบประเมิน</div>
    <div class="loading-text">กรุณารอสักครู่...</div>
  </div>

  <iframe
    id="surveyFrame"
    src="https://script.google.com/macros/s/xxxxx/exec"
    onload="surveyLoaded()">
  </iframe>

</div>

<script>
function surveyLoaded() {
  document.getElementById("surveyLoading").style.display = "none";
  document.getElementById("surveyFrame").style.display = "block";
}
</script>
